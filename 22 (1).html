<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 20px; margin: 20px auto; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
.laukums {
  width: 100%;
  height: 100%;
  padding: 10px;
  border: 3px solid #ff3b3b;
  background-color: #f77429;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Krekera Rieksta Piedzīvojums</h1>
<div class="laukums">
  <p>Gatavojies ceļojumam!</p>
  <p>Savāc riekstus, izvairies no mandeļiem un iegūsti pēc iespējas vairāk punktu!</p>
  <p>Izmanto īpašos sāļos riekstus!</p>
  <p>Svacot riekstus nomet noteiktos riekstus pareizajās vietās</p>
  <p>Izmanto saldos riekstus lai enerģiju atjaunot!</p>
</div>
<button>Sākt</button>
<button>Noteikumi</button>
</body>
</html>
